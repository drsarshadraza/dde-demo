<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Phytomedix | Bio-OS v31.0</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --forest:#1a3d2b; --green:#2e7d4f; --leaf:#4caf71; --mint:#e6f5ec;
  --ink:#1a2332; --slate:#4a5568; --mist:#f7f9f8; --white:#ffffff;
  --border:#e2e8e5; --red:#c53030; --amber:#d97706; --blue:#1d4ed8;
  --improving:#2e7d4f; --stable:#1d4ed8; --declining:#c53030; --baseline:#6b7280;
  --bioOs:#0F3460; --gold:#B8860B; --goldBg:#FFFBEB;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
*{-webkit-tap-highlight-color:transparent;}
body{font-family:'Outfit',sans-serif;background:var(--mist);color:var(--ink);min-height:100vh;padding:20px 16px 40px;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
.site-header{width:100%;max-width:700px;display:flex;align-items:center;justify-content:space-between;padding:18px 0 24px;border-bottom:1px solid var(--border);margin-bottom:24px;}
.logo-text{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--forest);letter-spacing:1px;}
.logo-sub{font-size:9px;font-family:'DM Mono',monospace;color:var(--green);letter-spacing:1px;display:block;}
.header-right{display:flex;align-items:center;gap:10px;}
.engine-badge{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--green);background:var(--mint);border:1px solid #b7d9c3;padding:4px 10px;border-radius:20px;letter-spacing:0.6px;}
.session-indicator{font-family:'DM Mono',monospace;font-size:9px;color:var(--green);background:var(--mint);border:1px solid #b7d9c3;padding:4px 10px;border-radius:20px;display:none;}
.session-indicator.active{display:inline-flex;align-items:center;gap:5px;}
.session-indicator::before{content:'●';font-size:8px;}
.logout-btn{font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;color:var(--slate);background:none;border:1px solid var(--border);padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s;display:none;}
.logout-btn:hover{border-color:var(--slate);background:var(--mist);}
.container{width:100%;max-width:700px;}

/* AUTH SCREENS */
#loginScreen{width:100%;max-width:420px;margin:0 auto;animation:fadeUp .4s ease;}
.login-card{background:var(--white);border-radius:20px;padding:36px 32px;box-shadow:0 4px 24px rgba(0,0,0,.08),0 0 0 1px var(--border);}
.login-heading{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--forest);margin-bottom:6px;text-align:center;}
.login-sub{font-size:13px;color:var(--slate);margin-bottom:28px;text-align:center;line-height:1.6;}
.login-field{margin-bottom:14px;}
.login-field label{display:block;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--slate);text-transform:uppercase;margin-bottom:6px;}
.login-field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:16px;color:var(--ink);background:var(--white);transition:border-color .15s;-webkit-appearance:none;min-height:48px;}
.login-field input:focus{outline:none;border-color:var(--green);}
.login-field input.error{border-color:var(--red);}
.pin-hint{font-size:11px;color:var(--slate);margin-top:4px;opacity:.8;display:block;}
.login-btn{width:100%;padding:15px;background:var(--forest);color:white;border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;min-height:52px;margin-top:6px;}
.login-btn:hover{background:var(--green);transform:translateY(-1px);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.login-error{background:#fff0f0;border:1px solid #fca5a5;border-radius:8px;padding:10px 13px;font-size:12px;color:var(--red);margin-top:12px;display:none;line-height:1.5;}
.login-note{background:var(--mint);border:1px solid #c8e6d5;border-radius:8px;padding:10px 13px;font-size:11px;color:var(--forest);margin-top:16px;line-height:1.6;text-align:center;}
.auth-switch-link{text-align:center;font-size:12px;color:var(--slate);margin-top:14px;}
.auth-switch-link a{color:var(--green);font-weight:700;text-decoration:none;cursor:pointer;}

/* REGISTER */
#registerScreen{width:100%;max-width:460px;margin:0 auto;animation:fadeUp .4s ease;display:none;}
.reg-card{background:var(--white);border-radius:20px;padding:36px 32px;box-shadow:0 4px 24px rgba(0,0,0,.08),0 0 0 1px var(--border);margin-bottom:16px;}
.reg-steps{display:flex;align-items:center;gap:0;margin-bottom:26px;padding:0 4px;}
.reg-step{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;position:relative;}
.reg-step:not(:last-child)::after{content:'';position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--border);z-index:0;}
.reg-step.done:not(:last-child)::after{background:var(--green);}
.reg-step .step-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--white);color:var(--slate);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;z-index:1;position:relative;flex-shrink:0;}
.reg-step.active .step-dot{border-color:var(--green);background:var(--green);color:white;}
.reg-step.done .step-dot{border-color:var(--green);background:var(--green);color:white;}
.reg-step.done .step-dot::after{content:'✓';font-size:12px;}
.reg-step.done .step-dot span{display:none;}
.reg-step-label{font-size:9px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--slate);}
.reg-step.active .reg-step-label{color:var(--green);}
.reg-step.done .reg-step-label{color:var(--forest);}
.reg-panel{display:none;}
.reg-panel.active{display:block;animation:fadeUp .25s ease;}
.reg-panel-heading{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--forest);margin-bottom:4px;}
.reg-panel-sub{font-size:13px;color:var(--slate);margin-bottom:20px;line-height:1.55;}
.reg-field{margin-bottom:14px;}
.reg-field label{display:block;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--slate);text-transform:uppercase;margin-bottom:6px;}
.reg-field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:16px;color:var(--ink);background:var(--white);transition:border-color .15s;min-height:48px;}
.reg-field input:focus{outline:none;border-color:var(--green);}
.reg-field input.error{border-color:var(--red);}
.reg-field input.success{border-color:var(--leaf);}
.reg-field .reg-hint{font-size:11px;color:var(--slate);margin-top:4px;opacity:.8;display:block;}
.pin-strength-bar{height:3px;background:var(--border);border-radius:2px;margin:6px 0 3px;overflow:hidden;}
.pin-strength-fill{height:100%;border-radius:2px;width:0;transition:width .3s,background .3s;}
.pin-strength-text{font-size:10px;font-weight:600;}
.pin-strength-text.weak{color:var(--red);}
.pin-strength-text.medium{color:var(--amber);}
.pin-strength-text.strong{color:var(--green);}
.pin-match-msg{font-size:11px;font-weight:600;margin-top:5px;min-height:16px;}
.pin-match-msg.match{color:var(--green);}
.pin-match-msg.nomatch{color:var(--red);}
.reg-nav{display:flex;gap:10px;margin-top:6px;align-items:center;justify-content:space-between;}
.reg-nav-counter{font-size:11px;color:var(--slate);}
.btn-reg-back{padding:13px 18px;border:1.5px solid var(--border);border-radius:10px;background:none;cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;color:var(--slate);min-height:48px;}
.btn-reg-next{padding:13px 24px;background:var(--forest);color:white;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;min-height:48px;}
.btn-reg-next:hover{background:var(--green);}
.btn-reg-next:disabled{opacity:.6;cursor:not-allowed;}
.reg-confirm-box{background:var(--mist);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:18px;display:grid;gap:10px;}
.reg-confirm-row{display:flex;justify-content:space-between;align-items:center;}
.reg-confirm-key{font-size:10px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.5px;}
.reg-confirm-val{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink);}
.reg-error{background:#fff0f0;border:1px solid #fca5a5;border-radius:8px;padding:10px 13px;font-size:12px;color:var(--red);margin-top:12px;display:none;line-height:1.5;}
.reg-security-note{background:var(--mint);border:1px solid #c8e6d5;border-radius:8px;padding:10px 13px;font-size:11px;color:var(--forest);margin-top:16px;line-height:1.6;text-align:center;}

/* SUCCESS */
#regSuccessScreen{display:none;width:100%;max-width:460px;margin:0 auto;animation:fadeUp .4s ease;}
.success-card{background:var(--white);border-radius:20px;padding:36px 32px;box-shadow:0 4px 24px rgba(0,0,0,.08),0 0 0 1px var(--border);text-align:center;}
.success-emoji{font-size:52px;display:block;margin-bottom:14px;}
.success-heading{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--forest);margin-bottom:8px;}
.success-sub{font-size:13px;color:var(--slate);margin-bottom:24px;line-height:1.65;}
.pin-reveal{background:var(--mint);border:1px solid #b7d9c3;border-radius:14px;padding:20px 24px;margin-bottom:20px;text-align:left;}
.pin-reveal-label{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.pin-reveal-value{font-family:'DM Mono',monospace;font-size:30px;font-weight:500;color:var(--forest);letter-spacing:8px;margin-bottom:8px;}
.pin-reveal-note{font-size:12px;color:var(--slate);line-height:1.6;}
.pin-save-warning{background:#fff7ed;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;font-size:12px;color:#78350f;margin-bottom:20px;line-height:1.6;text-align:left;}
.btn-go-login{width:100%;padding:15px;background:var(--forest);color:white;border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;min-height:52px;}
.btn-go-login:hover{background:var(--green);}
.btn-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin-s .7s linear infinite;vertical-align:middle;margin-right:7px;}
@keyframes spin-s{to{transform:rotate(360deg);}}

/* SESSION WARNING */
.session-warning{background:#fff7ed;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;font-size:12px;color:#78350f;margin-bottom:14px;display:none;line-height:1.5;}
.session-warning a{color:#78350f;font-weight:700;}

/* TAB BAR */
.tab-bar{display:flex;gap:6px;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:18px;}
.tab-btn{flex:1;padding:9px 14px;border:none;border-radius:8px;background:none;cursor:pointer;color:var(--slate);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;transition:all .15s;min-height:44px;}
.tab-btn.active{background:var(--forest);color:white;}
.tab-btn .tab-icon{font-size:14px;margin-right:6px;}

/* CARDS */
.card{background:var(--white);border-radius:16px;padding:26px 24px;box-shadow:0 2px 12px rgba(0,0,0,.05),0 0 0 1px var(--border);margin-bottom:14px;}
.card-title{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--slate);margin-bottom:18px;}

/* PHASE WIZARD — 6 steps */
.phase-stepper{display:flex;align-items:center;gap:0;margin-bottom:24px;padding:0 2px;overflow:hidden;}
.phase-step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative;cursor:default;min-width:0;}
.phase-step:not(:last-child)::after{content:'';position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--border);z-index:0;}
.phase-step.done:not(:last-child)::after{background:var(--green);}
.step-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--white);color:var(--slate);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;z-index:1;position:relative;flex-shrink:0;}
.phase-step.active .step-dot{border-color:var(--green);background:var(--green);color:white;}
.phase-step.done .step-dot{border-color:var(--green);background:var(--green);color:white;}
.phase-step.done .step-dot::after{content:'✓';font-size:11px;}
.phase-step.done .step-dot span{display:none;}
.step-label{font-size:8px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--slate);text-align:center;white-space:nowrap;}
.phase-step.active .step-label{color:var(--green);}
.phase-step.done .step-label{color:var(--forest);}
.phase-panel{display:none;}
.phase-panel.active{display:block;}
.phase-heading{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--forest);margin-bottom:4px;}
.phase-sub{font-size:13px;color:var(--slate);margin-bottom:22px;font-weight:400;}

/* FORM ELEMENTS */
.field-label{display:block;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--slate);margin-bottom:6px;text-transform:uppercase;}
input[type="text"],input[type="number"],input[type="email"],select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:16px;color:var(--ink);background:var(--white);transition:border-color .15s;-webkit-appearance:none;min-height:44px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);}
input.error,select.error{border-color:var(--red);}
textarea{resize:vertical;font-size:14px;}
.field-row{display:grid;gap:12px;margin-bottom:14px;}
.field-row.two-col{grid-template-columns:1fr 1fr;}
.field-hint{font-size:11px;color:var(--slate);margin-top:4px;opacity:.8;}

/* RADIO + TILE */
.radio-group{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.radio-opt{flex:1;min-width:calc(33.33% - 8px);padding:12px 8px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;font-size:13px;color:var(--slate);transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px;justify-content:center;user-select:none;}
.radio-opt input[type="radio"]{display:none;}
.radio-opt.selected{border-color:var(--green);background:var(--mint);color:var(--forest);}
.radio-opt .radio-icon{font-size:16px;}
.radio-opt .radio-text{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}

.signals-label{font-size:10px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:block;}
.signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.signal-label{display:flex;align-items:center;gap:9px;padding:12px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;color:var(--ink);cursor:pointer;transition:all .15s;background:var(--white);min-height:48px;user-select:none;}
.signal-label input[type="checkbox"]{display:none;}
.signal-label .dot{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;transition:all .15s;position:relative;}
.signal-label.selected .dot{background:var(--green);border-color:var(--green);}
.signal-label.selected .dot::after{content:'';position:absolute;left:4px;top:1px;width:6px;height:9px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg);}
.signal-label.selected{border-color:var(--green);background:var(--mint);}
.signal-label .sig-icon{font-size:14px;flex-shrink:0;}
.conditional-field{display:none;}

.tile-select{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px;}
.tile-select.two-col{grid-template-columns:1fr 1fr;}
.tile-select.three-col{grid-template-columns:1fr 1fr 1fr;}
.tile-opt{padding:12px 8px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;transition:all .15s;background:var(--white);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;user-select:none;}
.tile-opt input[type="radio"]{display:none;}
.tile-opt.selected{border-color:var(--green);background:var(--mint);}
.tile-opt .tile-icon{font-size:18px;display:block;}
.tile-opt .tile-text{font-size:10px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.3px;}
.tile-opt.selected .tile-text{color:var(--forest);}

/* SLIDERS */
.subjective-slider{margin-bottom:20px;}
.slider-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.slider-label{font-size:12px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.4px;}
.slider-value{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:var(--green);}
input[type="range"]{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:3px;outline:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--forest);cursor:pointer;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.25);}
input[type="range"]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--forest);cursor:pointer;border:3px solid white;}
.slider-ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--slate);margin-top:4px;}
.slider-group{margin-bottom:20px;}

/* PHASE NAV */
.phase-nav{display:flex;gap:10px;margin-top:6px;justify-content:space-between;align-items:center;}
.btn-back{padding:13px 20px;border:1.5px solid var(--border);border-radius:10px;background:none;cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;color:var(--slate);transition:all .15s;min-height:48px;}
.btn-back:hover{background:var(--mist);border-color:var(--slate);}
.btn-next{flex:1;padding:14px 20px;background:var(--forest);color:white;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;min-height:48px;}
.btn-next:hover{background:var(--green);transform:translateY(-1px);}
.btn-next:active{transform:none;}
.phase-counter{font-size:11px;color:var(--slate);white-space:nowrap;}

/* CTA */
.cta-btn{width:100%;padding:16px;background:var(--forest);color:white;border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;min-height:52px;}
.cta-btn:hover{background:var(--green);}
.cta-btn:disabled{opacity:.6;cursor:not-allowed;}

/* LOADING */
#loadingOverlay{display:none;text-align:center;padding:40px 0;}
.spinner-dna{font-size:48px;animation:spin-dna 2s ease-in-out infinite;display:inline-block;margin-bottom:16px;}
@keyframes spin-dna{0%,100%{transform:scale(1);}50%{transform:scale(1.2) rotate(10deg);}}
.loading-stage{font-family:'DM Mono',monospace;font-size:12px;color:var(--green);letter-spacing:.5px;min-height:20px;}
.loading-bar-wrap{width:200px;height:3px;background:var(--border);border-radius:2px;margin:14px auto 0;}
.loading-bar{height:100%;background:var(--green);border-radius:2px;width:0;transition:width .7s ease;}
.loading-sub{font-size:12px;color:var(--slate);margin-top:8px;}

/* DASHBOARD */
#dashboard{display:none;animation:fadeUp .5s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.coach-bar{background:linear-gradient(135deg,var(--forest) 0%,#1f4d36 100%);color:white;padding:18px 20px;border-radius:14px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start;}
.coach-icon{font-size:20px;flex-shrink:0;margin-top:1px;}
.coach-text{font-size:13px;line-height:1.7;color:rgba(255,255,255,.9);}

/* PAE URGENT */
.pae-urgent{background:#fff0f0;border:2px solid var(--red);border-radius:14px;padding:24px 20px;margin-bottom:14px;}
.pae-urgent-icon{font-size:36px;display:block;margin-bottom:12px;}
.pae-urgent-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--red);margin-bottom:8px;}
.pae-urgent-msg{font-size:14px;color:var(--ink);line-height:1.7;}
.pae-hold{background:#fff7ed;border:2px solid var(--amber);border-radius:14px;padding:24px 20px;margin-bottom:14px;}
.pae-hold-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--amber);margin-bottom:8px;}
.pae-hold-msg{font-size:13px;color:var(--ink);line-height:1.7;}
.pae-ref{font-family:'DM Mono',monospace;font-size:11px;color:var(--slate);margin-top:10px;}

/* PBU + TCM CARDS */
.pbu-card{background:var(--bioOs);border-radius:14px;padding:18px 20px;margin-bottom:12px;position:relative;overflow:hidden;}
.pbu-card::before{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;background:rgba(255,255,255,.04);border-radius:50%;}
.pbu-title{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px;}
.pbu-narrative{font-size:13px;line-height:1.75;color:rgba(255,255,255,.92);}
.pbu-confidence{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.6);}
.pbu-confidence-bar{width:80px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;}
.pbu-confidence-fill{height:100%;background:#4caf71;border-radius:2px;}
.tcm-card{background:var(--goldBg);border:1.5px solid #e8c840;border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.tcm-title{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.tcm-pattern-label{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#78350f;margin-bottom:6px;}
.tcm-narrative{font-size:12px;color:#92400e;line-height:1.65;}
.tcm-climate-note{font-size:11px;color:#a05020;margin-top:8px;font-style:italic;}

/* BADGES */
.badge-lifecycle-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.evo-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
.evo-badge.baseline{background:#f3f4f6;color:var(--baseline);border:1px solid #d1d5db;}
.evo-badge.improving{background:#dcfce7;color:var(--improving);border:1px solid #bbf7d0;}
.evo-badge.stable{background:#dbeafe;color:var(--stable);border:1px solid #bfdbfe;}
.evo-badge.declining{background:#fee2e2;color:var(--declining);border:1px solid #fecaca;}
.evo-badge.urgent{background:#fee2e2;color:var(--red);border:1px solid #fecaca;}
.lifecycle-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;background:#f0fdf4;color:var(--forest);border:1px solid #bbf7d0;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.lifecycle-pill.recovery{background:#fee2e2;color:var(--declining);border-color:#fecaca;}
.lifecycle-pill.recalib{background:#fff7ed;color:var(--amber);border-color:#fed7aa;}
.resp-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.resp-badge.accelerating{background:#dcfce7;color:var(--green);border-color:#bbf7d0;}
.resp-badge.neutral{background:#e0f2fe;color:#0369a1;border-color:#bae6fd;}
.resp-badge.slowed{background:#fff7ed;color:var(--amber);border-color:#fed7aa;}
.resp-badge.stagnating{background:#fee2e2;color:var(--red);border-color:#fecaca;}

.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-tile{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;position:relative;overflow:hidden;}
.stat-tile::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--green);}
.stat-tile.declining::after{background:var(--red);}
.stat-tile.improving::after{background:var(--leaf);}
.stat
